<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="Illustrated treehouse library bookshelf">
  <defs>
    <radialGradient id="libCandleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D993" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5D993" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cozy arched library backing -->
  <rect x="4" y="4" width="312" height="88" rx="14" fill="#FAF4E6" stroke="#322116" stroke-width="2.5"/>

  <!-- Round leafy window on the left -->
  <circle cx="44" cy="48" r="24" fill="#A8D8E8" stroke="#322116" stroke-width="2.5"/>
  <path d="M24 52 Q36 42 46 52 Q56 44 65 54 L64 62 Q44 74 25 60 Z" fill="#8EBB70"/>
  <path d="M44 24 L44 72 M20 48 L68 48" stroke="#79563C" stroke-width="2.5"/>

  <!-- Wooden Bookcase Frame -->
  <rect x="82" y="12" width="224" height="72" rx="8" fill="#79563C" stroke="#322116" stroke-width="2.5"/>
  <rect x="88" y="18" width="212" height="27" rx="3" fill="#4A3221"/>
  <rect x="88" y="51" width="212" height="27" rx="3" fill="#4A3221"/>

  <!-- Top Shelf Spellbooks & Scrolls -->
  <rect x="94" y="23" width="11" height="22" rx="2" fill="#8EBB70" stroke="#322116" stroke-width="1.8"/>
  <rect x="106" y="21" width="12" height="24" rx="2" fill="#E8C477" stroke="#322116" stroke-width="1.8"/>
  <rect x="119" y="24" width="10" height="21" rx="2" fill="#B7A1DC" stroke="#322116" stroke-width="1.8"/>
  <rect x="130" y="22" width="14" height="23" rx="2" fill="#A8D8E8" stroke="#322116" stroke-width="1.8"/>
  <path d="M146 25 L156 23 L161 45 L151 45 Z" fill="#D49A6A" stroke="#322116" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Rolled parchment scrolls -->
  <rect x="174" y="34" width="32" height="9" rx="4" fill="#F4EBD5" stroke="#322116" stroke-width="1.6"/>
  <rect x="177" y="25" width="28" height="9" rx="4" fill="#E8C477" stroke="#322116" stroke-width="1.6"/>
  <line x1="188" y1="25" x2="188" y2="34" stroke="#B7A1DC" stroke-width="2"/>

  <!-- Inkwell & Quill -->
  <rect x="220" y="34" width="14" height="11" rx="3" fill="#315B3B" stroke="#322116" stroke-width="1.8"/>
  <path d="M227 34 Q236 22 246 19 Q239 27 230 34" fill="#E8C477" stroke="#322116" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Glowing Library Candle on Top Shelf -->
  <circle cx="272" cy="27" r="16" fill="url(#libCandleGlow)"/>
  <rect x="267" y="31" width="10" height="14" rx="2" fill="#FAF4E6" stroke="#322116" stroke-width="1.8"/>
  <path d="M272 22 C275 26, 275 30, 272 30 C269 30, 269 26, 272 22 Z" fill="#E8C477" stroke="#322116" stroke-width="1.4"/>

  <!-- Bottom Shelf Tomes -->
  <rect x="96" y="55" width="14" height="23" rx="2" fill="#B7A1DC" stroke="#322116" stroke-width="1.8"/>
  <rect x="111" y="58" width="11" height="20" rx="2" fill="#F4EBD5" stroke="#322116" stroke-width="1.8"/>
  <rect x="123" y="54" width="15" height="24" rx="2" fill="#315B3B" stroke="#322116" stroke-width="1.8"/>
  <rect x="140" y="57" width="12" height="21" rx="2" fill="#E8C477" stroke="#322116" stroke-width="1.8"/>
  <rect x="164" y="68" width="38" height="10" rx="2" fill="#8EBB70" stroke="#322116" stroke-width="1.8"/>
  <rect x="168" y="58" width="32" height="10" rx="2" fill="#A8D8E8" stroke="#322116" stroke-width="1.8"/>

  <!-- Magnifying Glass & Crystal Bookend -->
  <polygon points="220,78 228,58 237,78" fill="#B7A1DC" stroke="#322116" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="256" cy="65" r="8" fill="#D7EFF7" stroke="#322116" stroke-width="2"/>
  <line x1="262" y1="71" x2="270" y2="77" stroke="#322116" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Trailing Ivy Vine Accent -->
  <path d="M78 14 Q74 28 80 42 Q84 54 78 66" fill="none" stroke="#315B3B" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="75" cy="24" rx="4" ry="2.5" fill="#8EBB70" stroke="#322116" stroke-width="1.4"/>
  <ellipse cx="83" cy="48" rx="4" ry="2.5" fill="#8EBB70" stroke="#322116" stroke-width="1.4"/>
</svg>
