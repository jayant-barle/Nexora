<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="Living Giant Treehouse">
  <!-- Background distant forest silhouettes -->
  <ellipse cx="95" cy="215" rx="90" ry="38" fill="#8EBB70" stroke="#322116" stroke-width="3"/>
  <ellipse cx="545" cy="215" rx="95" ry="42" fill="#8EBB70" stroke="#322116" stroke-width="3"/>
  <ellipse cx="320" cy="224" rx="280" ry="32" fill="#315B3B" stroke="#322116" stroke-width="3"/>

  <!-- Winding dirt path -->
  <path d="M295 238 Q305 212 325 198 Q345 186 350 238 Z" fill="#F4EBD5" stroke="#322116" stroke-width="2.5"/>

  <!-- Main giant tree trunk & roots -->
  <path d="M250 218 Q275 185 278 118 L362 118 Q365 185 394 218 Q352 212 320 218 Q285 212 250 218 Z" fill="#79563C" stroke="#322116" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M278 135 Q235 120 210 95 L235 88 Q262 108 282 118 Z" fill="#79563C" stroke="#322116" stroke-width="3"/>
  <path d="M362 135 Q405 118 430 92 L405 84 Q380 105 358 118 Z" fill="#79563C" stroke="#322116" stroke-width="3"/>

  <!-- Leafy treehouse canopy -->
  <circle cx="245" cy="78" r="56" fill="#315B3B" stroke="#322116" stroke-width="3.5"/>
  <circle cx="395" cy="78" r="54" fill="#315B3B" stroke="#322116" stroke-width="3.5"/>
  <circle cx="320" cy="58" r="68" fill="#8EBB70" stroke="#322116" stroke-width="3.5"/>

  <!-- Cozy wooden treehouse cabin -->
  <rect x="274" y="84" width="92" height="58" rx="10" fill="#F4EBD5" stroke="#322116" stroke-width="3.5"/>
  <path d="M262 90 L320 52 L378 90 Z" fill="#79563C" stroke="#322116" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Warm glowing arched doorway & window -->
  <path d="M306 142 L306 116 A14 14 0 0 1 334 116 L334 142 Z" fill="#E8C477" stroke="#322116" stroke-width="3"/>
  <circle cx="320" cy="74" r="8" fill="#A8D8E8" stroke="#322116" stroke-width="2.5"/>

  <!-- Glowing mushrooms -->
  <g stroke="#322116" stroke-width="2.2">
    <rect x="218" y="196" width="8" height="14" rx="3" fill="#F4EBD5"/>
    <path d="M210 198 C212 184, 232 184, 234 198 Z" fill="#B7A1DC"/>
    <rect x="412" y="198" width="7" height="12" rx="3" fill="#F4EBD5"/>
    <path d="M405 200 C407 188, 424 188, 426 200 Z" fill="#E8C477"/>
  </g>
</svg>
