name: Nexora CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Typecheck & Test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-worker/requirements.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Rebuild Native Modules
        run: npx electron-builder install-app-deps

      - name: Typecheck Renderer
        run: npm run typecheck

      - name: Typecheck Main Process
        run: npm run typecheck:main

      - name: Run Vitest Test Suite
        run: npm test

      - name: Compile Production Bundle
        run: npm run build
